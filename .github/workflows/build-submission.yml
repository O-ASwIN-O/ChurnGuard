name: Build ChurnGuard analysis outputs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/processed/**'
      - 'figures/**'
      - 'reports/**'
      - 'presentation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run analysis and generate deliverables
        run: python src/run_analysis.py
      - name: Run missingness sensitivity audit
        run: python src/audit_missingness.py
      - name: Package code and analysis outputs (no slides)
        run: |
          zip -rq ChurnGuard_Code_and_Outputs.zip README.md requirements.txt notebook src data figures reports .github outputs
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: churnguard-code-and-analysis-outputs
          path: |
            ChurnGuard_Code_and_Outputs.zip
            data/processed/*.csv
            data/processed/*.json
            figures/*.png
            reports/FINAL_REPORT.md
            reports/ANALYSIS_SUMMARY.json
            reports/MISSINGNESS_AUDIT.md
            outputs/*
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated analysis outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/*.csv data/processed/*.json figures/*.png reports/*.md reports/ANALYSIS_SUMMARY.json outputs/*
          git rm -f --ignore-unmatch presentation/ChurnGuard_Final_Presentation.pptx
          if git diff --cached --quiet; then
            echo "Analysis outputs are already up to date."
          else
            git commit -m "Publish ChurnGuard code outputs and analysis results"
            git push
          fi
