name: Build ChurnGuard submission artifacts

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/processed/**'
      - 'figures/**'
      - 'reports/**'
      - 'presentation/ChurnGuard_Final_Presentation.pptx'
      - 'presentation/ANALYSIS_SUMMARY.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run analysis and generate deliverables
        run: python src/run_analysis.py
      - name: Package reproducible project and outputs
        run: |
          zip -rq ChurnGuard_Full_Project.zip README.md requirements.txt notebook src data figures reports presentation .github
      - name: Upload generated submission files
        uses: actions/upload-artifact@v4
        with:
          name: churnguard-submission-artifacts
          path: |
            ChurnGuard_Full_Project.zip
            data/processed/*.csv
            data/processed/*.json
            figures/*.png
            reports/FINAL_REPORT.md
            reports/ANALYSIS_SUMMARY.json
            presentation/ChurnGuard_Final_Presentation.pptx
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated deliverables to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/*.csv data/processed/*.json figures/*.png reports/FINAL_REPORT.md reports/ANALYSIS_SUMMARY.json presentation/ChurnGuard_Final_Presentation.pptx
          if git diff --cached --quiet; then
            echo "Generated deliverables are already up to date."
          else
            git commit -m "Publish generated ChurnGuard analysis deliverables"
            git push
          fi
